<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peach Girl Store API Bridge</title>
</head>
<body>
  <script>
    (function () {
      'use strict';
      var TRUSTED_ORIGIN = 'https://embassysubtle1g.github.io';

      window.addEventListener('message', function (event) {
        if (event.origin !== TRUSTED_ORIGIN) return;
        var message = event.data;
        if (!message || message.type !== 'PEACH_API_REQUEST' || typeof message.id !== 'string') return;

        google.script.run
          .withSuccessHandler(function (result) {
            event.source.postMessage({
              type: 'PEACH_API_RESPONSE',
              id: message.id,
              result: result
            }, TRUSTED_ORIGIN);
          })
          .withFailureHandler(function (error) {
            event.source.postMessage({
              type: 'PEACH_API_RESPONSE',
              id: message.id,
              result: { success: false, message: error && error.message ? error.message : 'API 執行失敗' }
            }, TRUSTED_ORIGIN);
          })
          .bridgeCall(message.payload);
      });

      // The readiness message contains no private data. Use '*' because HtmlService
      // may wrap or redirect the bridge into a Google-hosted frame whose origin
      // is not the GitHub Pages origin. The parent validates the sender origin.
      window.top.postMessage({ type: 'PEACH_BRIDGE_READY' }, '*');
    })();
  </script>
</body>
</html>
